apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: fittrack

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend
        image: ashytcloud/fittrack-backend:latest

        ports:
        - containerPort: 3000

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        env:
          - name: PORT
            valueFrom:
              configMapKeyRef:
                name: fittrack-config
                key: PORT

          - name: MONGO_DB
            valueFrom:
              configMapKeyRef:
                name: fittrack-config
                key: MONGO_DB

          - name: MONGO_USER
            valueFrom:
              secretKeyRef:
                name: fittrack-secret
                key: MONGO_USER

          - name: MONGO_PASSWORD
            valueFrom:
              secretKeyRef:
                name: fittrack-secret
                key: MONGO_PASSWORD
