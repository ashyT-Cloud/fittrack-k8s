apiVersion: apps/v1
kind: Deployment

metadata:
  name: mongodb
  namespace: fittrack

spec:
  replicas: 1

  selector:
    matchLabels:
      app: mongodb

  template:
    metadata:
      labels:
        app: mongodb

    spec:
      containers:
      - name: mongodb
        image: mongo:7.0

        ports:
        - containerPort: 27017

        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom:
            secretKeyRef:
              name: fittrack-secret
              key: MONGO_USER

        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fittrack-secret
              key: MONGO_PASSWORD

        - name: MONGO_INITDB_DATABASE
          valueFrom:
            configMapKeyRef:
              name: fittrack-config
              key: MONGO_DB

        volumeMounts:
        - name: mongodb-storage
          mountPath: /data/db

      volumes:
      - name: mongodb-storage
        persistentVolumeClaim:
          claimName: mongodb-pvc
